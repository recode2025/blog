# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Pixel & Pointer
subtitle: 'Graphics · Code · Algorithms · Creation'
description: '一个关于代码、图形与成长的个人技术博客。记录计算机图形学、3D 建模与动画的探索，分享 Python、C++、算法与 ACM 学习笔记，同时记录 408 与 IELTS 的学习过程。从 Pointer 到 Pixel，从 Algorithm 到 Render。Keep learning. Keep building.'
keywords:
  - 计算机图形学
  - Computer Graphics
  - C++
  - Python
  - ACM
  - 算法
  - 数据结构
  - 408
  - 考研408
  - 3D建模
  - Blender
  - Houdini
  - Unity
  - 动画
  - 角色动画
  - Rendering
  - Shader
  - OpenGL
  - IELTS
  - 雅思
  - 编程
  - 技术博客
  - 学习笔记
author: recode
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.recode88.cn
permalink: posts/:title/
permalink_defaults:
permalink_pinyin:
  enable: true
  separator: '-'
pretty_urls:
  trailing_index: false # Canonical links omit index.html
  trailing_html: false # Canonical links omit .html

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'vendor/**'
  - 'assets/**'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: volantis

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# Site extensions generate search, RSS, sitemap and reading statistics without runtime APIs.
favicon: /assets/tephrofos/favicon.svg
jsonContent:
  file: search.json
marked:
  gfm: true
  breaks: false
  smartLists: true
# Build-time processing handles code highlighting; no highlighter is downloaded by readers.
