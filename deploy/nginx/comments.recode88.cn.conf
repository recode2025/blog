# Artalk comments service. Nginx runs on the Docker host.
# Install under /etc/nginx/conf.d/ (included inside the http context).
# DNS A and AAAA records must point comments.recode88.cn to this host.
# The host needs working public IPv4 and IPv6; allow TCP 80 and 443 for both.
# Artalk must publish 127.0.0.1:23366:23366.
# For visitor IPs, set ATK_HTTP_PROXY_HEADER=X-Real-IP in the Artalk container.
#
# Certificates must exist before enabling the HTTPS server below.
# First issuance: temporarily enable only the HTTP server, then run:
#   sudo mkdir -p /var/www/letsencrypt
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d comments.recode88.cn
# After issuance, enable the complete file and run nginx -t before reloading.
# Configure certificate renewal to reload Nginx after successful renewal.

server {
    listen 80;
    listen [::]:80;
    server_name comments.recode88.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://comments.recode88.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comments.recode88.cn;

    # Replace these paths if your certificates are stored elsewhere.
    ssl_certificate /etc/letsencrypt/live/comments.recode88.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comments.recode88.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:23366;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Assumes this Nginx receives traffic directly, with no CDN in front.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache off;
        # Artalk handles CORS through its trusted site URLs.
    }
}
