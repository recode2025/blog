# Install under /etc/nginx/conf.d/ (inside the http context).
# Replace any existing vhosts for these two names to avoid duplicate server_name.
# Both domains need working A/AAAA records and TCP 80/443 access over IPv4/IPv6.
# The static root matches DEPLOY_PATH=/var/www/blog in .env.deploy.local.
#
# The certificate must cover BOTH www.recode88.cn and recode88.cn.
# Before first issuance, enable ONLY the HTTP server block below, then run:
#   sudo mkdir -p /var/www/letsencrypt
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/letsencrypt \
#     --cert-name www.recode88.cn -d www.recode88.cn -d recode88.cn
# After issuance, enable the full file, test and reload Nginx.
# Configure certificate renewal with a deploy hook to reload Nginx.

# HTTP: both names redirect to the canonical HTTPS host.
# Keep the ACME challenge reachable for certificate issuance and renewal.
server {
    listen 80;
    listen [::]:80;
    server_name www.recode88.cn recode88.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.recode88.cn$request_uri;
    }
}

# HTTPS bare domain: complete TLS, then redirect to www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name recode88.cn;

    ssl_certificate /etc/letsencrypt/live/www.recode88.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.recode88.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.recode88.cn$request_uri;
}

# Canonical HTTPS site: serve the release selected by pnpm run deploy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.recode88.cn;

    ssl_certificate /etc/letsencrypt/live/www.recode88.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.recode88.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/blog/current;
    index index.html;
    # See new releases immediately after the current symlink is switched.
    open_file_cache off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
